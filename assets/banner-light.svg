<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t">
  <title id="t">lord.sh_ — Windows internals · kernel · reverse engineering</title>
  <style>
    :root {
      --panel: #f6f8fa;
      --border: #d0d7de;
      --fg: #1f2328;
      --muted: #59636e;
      --dim: #8c959f;
      --accent: #bc4c00;
    }
    text { white-space: pre; font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .fg { fill: var(--fg); }
    .muted { fill: var(--muted); }
    .dim { fill: var(--dim); }
    .accent { fill: var(--accent); }
    .l { animation: in .45s ease-out both; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l, .cur { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="12" style="fill:var(--panel);stroke:var(--border)"/>
  <line x1="0.5" y1="44" x2="1199.5" y2="44" style="stroke:var(--border)"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" font-size="13" class="dim">~/lord.sh_</text>

  <!-- left: prompt -->
  <g font-size="20">
    <text x="44" y="104" class="l" style="animation-delay:.1s"><tspan class="accent">$</tspan><tspan class="fg"> whoami</tspan></text>
    <text x="44" y="170" font-size="56" font-weight="700" class="l fg" style="animation-delay:.45s">lord.sh<tspan class="accent">_</tspan></text>
    <text x="44" y="226" class="l" style="animation-delay:.9s"><tspan class="accent">$</tspan><tspan class="fg"> cat focus.txt</tspan></text>
    <text x="44" y="262" class="l muted" style="animation-delay:1.25s">Windows internals · kernel · reverse engineering</text>
    <text x="44" y="306" class="l accent" style="animation-delay:1.6s">$</text>
    <rect x="70" y="289" width="11" height="21" class="fg cur"/>
  </g>

  <!-- right: x64 page walk (indices match the VA) -->
  <g font-size="15">
    <text x="880" y="112" class="l dim" style="animation-delay:.6s">// x64 page walk</text>
    <text x="880" y="148" class="l" style="animation-delay:.8s"><tspan class="muted">VA  </tspan><tspan class="fg">0x00007ff6`1a2b3c40</tspan></text>
    <text x="880" y="176" class="l" style="animation-delay:.95s"><tspan class="dim"> ├─ </tspan><tspan class="muted">PML4 </tspan><tspan class="accent">[0ff]</tspan></text>
    <text x="880" y="204" class="l" style="animation-delay:1.1s"><tspan class="dim"> ├─ </tspan><tspan class="muted">PDPT </tspan><tspan class="accent">[1d8]</tspan></text>
    <text x="880" y="232" class="l" style="animation-delay:1.25s"><tspan class="dim"> ├─ </tspan><tspan class="muted">PD   </tspan><tspan class="accent">[0d1]</tspan></text>
    <text x="880" y="260" class="l" style="animation-delay:1.4s"><tspan class="dim"> ├─ </tspan><tspan class="muted">PT   </tspan><tspan class="accent">[0b3]</tspan></text>
    <text x="880" y="288" class="l" style="animation-delay:1.55s"><tspan class="dim"> └─ </tspan><tspan class="muted">PA   </tspan><tspan class="fg">0x00000001`2f4e5c40</tspan></text>
  </g>
</svg>
